name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: analyze · test · build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # O sandbox de desenvolvimento não tem acesso a storage.googleapis.com,
      # então o esqueleto nativo (gradle wrapper, gradle scripts) é materializado
      # aqui e os arquivos canônicos de tool/android/ são aplicados por cima.
      - name: Materialize Android project
        run: bash tool/setup_android.sh

      - name: Dependencies
        run: flutter pub get

      # Formata no workspace da CI (o sandbox de desenvolvimento não tem o SDK
      # Dart, então não há como formatar localmente antes do push).
      - name: Format
        run: dart format .

      - name: Analyze
        # Infos de estilo não derrubam o build; erros e avisos, sim.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/directtube-debug.apk
          ls -la dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: directtube-debug-apk
          path: dist/directtube-debug.apk
          if-no-files-found: error
