name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O sandbox de desenvolvimento não consegue baixar logs/artefatos da Actions
# (domínio bloqueado), então em caso de falha a esteira publica o fim do log
# como um comentário no próprio commit — legível via api.github.com.
permissions:
  contents: write

jobs:
  build-android:
    name: analyze · test · build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Materialize Android project
        run: bash tool/setup_android.sh | tee -a ci.log

      - name: Dependencies
        run: flutter pub get | tee -a ci.log

      - name: Format
        run: dart format . | tee -a ci.log

      - name: Analyze
        # Erros de compilação derrubam; avisos de estilo não (vêm no log de qualquer forma).
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci.log

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee -a ci.log

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee -a ci.log

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/directtube-debug.apk
          ls -la dist/ | tee -a ci.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: directtube-debug-apk
          path: dist/directtube-debug.apk
          if-no-files-found: error

      - name: Report failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI falhou (run $GITHUB_RUN_ID)"
            echo
            echo '```'
            tail -n 150 ci.log 2>/dev/null || echo "(sem ci.log)"
            echo '```'
          } > body.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body=@body.md || echo "não consegui comentar"
